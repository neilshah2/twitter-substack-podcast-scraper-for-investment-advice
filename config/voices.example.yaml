# Sample synthetic TTS voices for the spoken digest.
#
# All entries are stock voices from the TTS provider — purely synthetic,
# no real people, no personas. Pick one per run:
#
#   export TTS_VOICE=nova
#   python3 src/make_audio.py --digest output/digest-2026-09-23.md --voice narrator_female
#
# --voice accepts either a preset name below or a raw provider voice id.

voices:
  narrator_male:
    provider_voice: "onyx"
    description: "Masculine-sounding synthetic voice."

  narrator_female:
    provider_voice: "nova"
    description: "Feminine-sounding synthetic voice."

  narrator_neutral:
    provider_voice: "alloy"
    description: "Neutral synthetic voice (default)."
